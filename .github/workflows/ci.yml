name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secretos:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (SHA-256 verificado)
        run: |
          curl -fsSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git . -c .gitleaks.toml --redact --verbose --exit-code 1

  flutter:
    name: Flutter (análisis, tests y cobertura)
    runs-on: ubuntu-latest
    needs: secretos
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Cobertura de la lógica de negocio (domain + data ≥ 70 %)
        run: python3 tools/coverage_gate.py coverage/lcov.info 70 lib/domain lib/data
      - name: Compilar la web
        run: flutter build web --release --no-web-resources-cdn --base-href /PEUC/

  pipeline:
    name: Pipeline del banco (pytest)
    runs-on: ubuntu-latest
    needs: secretos
    defaults:
      run:
        working-directory: tools/bank_pipeline
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/bank_pipeline/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
