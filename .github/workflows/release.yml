name: Release (Android + iOS)

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Llave de firma (desde GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/peuc.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/peuc.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK se firma con la llave de depuración y no podrá actualizarse sobre versiones firmadas."
          fi
      - name: Compilar APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk PEUC.apk
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: android
          path: PEUC.apk

  ios:
    name: iOS sin firmar
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compilar para iPhone (sin firma de código)
        run: flutter build ios --release --no-codesign
      - name: Empaquetar IPA sin firmar
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr PEUC-sin-firmar.ipa Payload
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ios
          path: PEUC-sin-firmar.ipa

  publicar:
    name: Publicar release
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          name: P.E.U.C. ${{ github.ref_name }}
          files: |
            PEUC.apk
            PEUC-sin-firmar.ipa
          generate_release_notes: true
          body: |
            **Android:** descarga `PEUC.apk` e instálalo (permite "fuentes desconocidas").
            **iPhone:** usa la versión web desde Safari → Compartir → "Añadir a pantalla de inicio".
            `PEUC-sin-firmar.ipa` es solo para quien firma sus propias apps (AltStore, Sideloadly).
            **Web:** https://diegofranciscog.github.io/PEUC/
