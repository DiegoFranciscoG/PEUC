<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Replaced by `flutter build web --base-href` (e.g. /PEUC/ on GitHub Pages). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Prepárate para el examen de admisión de la Universidad de Cuenca con las 2737 preguntas del banco oficial 2026, respuestas verificadas, justificaciones y simulacros de 60 preguntas.">
  <meta name="theme-color" content="#2B5BA7">
  <meta name="referrer" content="no-referrer">

  <!-- iOS: se instala desde Safari con "Añadir a pantalla de inicio" -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="P.E.U.C.">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>P.E.U.C. — Banco oficial UCuenca 2026</title>

  <style>
    body { margin: 0; background: #F8F9FF; font-family: Roboto, system-ui, sans-serif; }
    #cargando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #1B3E7C; }
    #cargando img { width: 96px; height: 96px; border-radius: 22px; }
    @media (prefers-color-scheme: dark) { body { background: #111318; } #cargando { color: #B0C6FF; } }
  </style>
</head>
<body>
  <div id="cargando" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <span>Cargando el banco oficial…</span>
  </div>
  <noscript>P.E.U.C. necesita JavaScript para funcionar.</noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('cargando');
      if (el) el.remove();
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
